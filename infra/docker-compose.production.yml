name: atlas

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/production.env}
    volumes:
      - atlas_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  server:
    # Releases pull an immutable commit-SHA image; local builds remain supported.
    image: ghcr.io/affank1020/atlas-server:${ATLAS_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: infra/server.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in infra/production.env}
      ATLAS_HOST: 0.0.0.0
      ATLAS_PORT: "3000"
      ATLAS_NODE_EXECUTION: remote
      ATLAS_TRUSTED_INGRESS: "true"
      ATLAS_MCP_RESOURCE: ${ATLAS_MCP_RESOURCE:-}
      ATLAS_MCP_OAUTH_ISSUER: ${ATLAS_MCP_OAUTH_ISSUER:-}
      ATLAS_MCP_OAUTH_ALLOWED_SUBJECT: ${ATLAS_MCP_OAUTH_ALLOWED_SUBJECT:-}
      ATLAS_WORKSPACE_ORIGINS: ${ATLAS_WORKSPACE_ORIGINS:?Set ATLAS_WORKSPACE_ORIGINS in infra/production.env}
      ATLAS_MEDIA_DIR: /var/lib/atlas/media
      OLLAMA_URL: ${OLLAMA_URL:-http://127.0.0.1:11434}
      FABRIC_EMBEDDING_MODEL: ${FABRIC_EMBEDDING_MODEL:-nomic-embed-text}
      CONTENTFUL_SPACE_ID: ${CONTENTFUL_SPACE_ID:-}
      CONTENTFUL_ENVIRONMENT: ${CONTENTFUL_ENVIRONMENT:-}
      CONTENTFUL_DELIVERY_ACCESS_TOKEN: ${CONTENTFUL_DELIVERY_ACCESS_TOKEN:-}
      CONTENTFUL_WEBHOOK_SIGNING_SECRET: ${CONTENTFUL_WEBHOOK_SIGNING_SECRET:-}
      CONTENTFUL_WEBHOOK_TTL_SECONDS: ${CONTENTFUL_WEBHOOK_TTL_SECONDS:-}
    depends_on:
      postgres:
        condition: service_healthy
    # Maintenance access only. This is deliberately loopback-bound on the VPS;
    # use an SSH tunnel rather than exposing Atlas Server directly.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - atlas_media:/var/lib/atlas/media
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  ingress:
    image: ghcr.io/affank1020/atlas-web:${ATLAS_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    restart: unless-stopped
    environment:
      ATLAS_SITE_ADDRESS: ${ATLAS_SITE_ADDRESS:?Set ATLAS_SITE_ADDRESS in infra/production.env}
      ATLAS_ADMIN_USER: ${ATLAS_ADMIN_USER:?Set ATLAS_ADMIN_USER in infra/production.env}
      ATLAS_ADMIN_PASSWORD_HASH: ${ATLAS_ADMIN_PASSWORD_HASH:?Set ATLAS_ADMIN_PASSWORD_HASH in infra/production.env}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  atlas_postgres:
  atlas_media:
  caddy_data:
  caddy_config:
