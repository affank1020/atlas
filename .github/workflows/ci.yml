name: Atlas CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # ECR Public exhausted its data quota on GitHub runners; use Docker Hub.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Block accidental publication of Atlas data
        shell: bash
        run: |
          if git ls-files -- 'apps/server/data/*.json' | grep -q .; then
            echo "::error::Local Atlas data snapshots must never be committed."
            exit 1
          fi
      - name: Validate both Atlas ingress Caddy modes
        shell: bash
        run: |
          set -euo pipefail
          hash="$(docker run --rm caddy:2-alpine caddy hash-password --plaintext ci-test-password)"
          for site in atlas.affankhan.dev :8080; do
            docker run --rm \
              -e ATLAS_SITE_ADDRESS="$site" \
              -e VPS_ADMIN_USER=ci-user \
              -e VPS_ADMIN_PASSWORD_HASH="$hash" \
              -v "$PWD/infra/Caddyfile.production:/etc/caddy/Caddyfile:ro" \
              caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
          done
      - name: Validate credential source compatibility
        shell: bash
        env:
          POSTGRES_PASSWORD: ci-postgres
          DATABASE_URL: postgresql://atlas:ci-postgres@postgres:5432/atlas
          ATLAS_SITE_ADDRESS: atlas.affankhan.dev
          ATLAS_WORKSPACE_ORIGINS: https://atlas.affankhan.dev
        run: |
          set -euo pipefail
          # New standalone vps-infra identity without legacy Atlas credentials.
          VPS_ADMIN_USER=ci-vps VPS_ADMIN_PASSWORD_HASH=ci-vps-hash \
            docker compose -f infra/docker-compose.production.yml config --format json \
            | node -e '
              let s="";process.stdin.on("data",c=>s+=c);
              process.stdin.on("end",()=>{
                const env=JSON.parse(s).services.ingress.environment;
                if(env.VPS_ADMIN_USER!=="ci-vps" || env.VPS_ADMIN_PASSWORD_HASH!=="ci-vps-hash")process.exit(1);
              });'
          # Existing production remains compatible until migration is applied.
          ATLAS_ADMIN_USER=ci-legacy ATLAS_ADMIN_PASSWORD_HASH=ci-legacy-hash \
            docker compose -f infra/docker-compose.production.yml config --format json \
            | node -e '
              let s="";process.stdin.on("data",c=>s+=c);
              process.stdin.on("end",()=>{
                const env=JSON.parse(s).services.ingress.environment;
                if(env.VPS_ADMIN_USER!=="ci-legacy" || env.VPS_ADMIN_PASSWORD_HASH!=="ci-legacy-hash")process.exit(1);
              });'
      - name: Validate production Compose structure
        shell: bash
        env:
          POSTGRES_PASSWORD: ci-postgres
          DATABASE_URL: postgresql://atlas:ci-postgres@postgres:5432/atlas
          ATLAS_SITE_ADDRESS: atlas.affankhan.dev
          ATLAS_ADMIN_USER: ci-user
          ATLAS_ADMIN_PASSWORD_HASH: ci-password-hash
          ATLAS_WORKSPACE_ORIGINS: https://atlas.affankhan.dev
        run: |
          docker compose -f infra/docker-compose.production.yml config --quiet
          # Simulate the *combined* private-mode configuration, not just
          # standalone Compose and Caddyfile syntax validation.
          ATLAS_SITE_ADDRESS=:8080 \
          ATLAS_INGRESS_HTTP_BIND=127.0.0.1:18080 \
          ATLAS_INGRESS_HTTP_TARGET_PORT=8080 \
          ATLAS_INGRESS_HTTPS_BIND=127.0.0.1:18443 \
          docker compose -f infra/docker-compose.production.yml config --format json \
            | node -e '
              let s="";process.stdin.on("data",c=>s+=c);
              process.stdin.on("end",()=>{
                const ports=JSON.parse(s).services.ingress.ports;
                const http=ports.find(p=>Number(p.target)===8080 && p.protocol==="tcp");
                if(!http||http.host_ip!=="127.0.0.1"||String(http.published)!=="18080") {
                  console.error("Private Atlas ingress port mapping must route 127.0.0.1:18080 to container :8080");
                  process.exit(1);
                }
              });'
      - name: Validate host-local Linux Node updater and lifecycle acceptance
        run: |
          python3 -m unittest discover -s test -p 'test_linux_node_host_updater.py' -v
          python3 -m unittest discover -s test -p 'test_linux_node_lifecycle_integration.py' -v
          python3 -m py_compile scripts/linux-node-host-updater.py test/test_linux_node_lifecycle_integration.py
          python3 -m unittest discover -s test -p 'test_macos_node_stage.py' -v
          python3 -m py_compile scripts/macos-node-stage.py
          python3 -m unittest discover -s test -p 'test_macos_node_lifecycle.py' -v
          python3 -m unittest discover -s test -p 'test_macos_node_update.py' -v
          python3 -m py_compile scripts/macos-node-lifecycle.py scripts/macos-node-update.py

      - name: Install dependencies
        run: npm ci
      - name: Test server, node, and web
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run test:benchmark

      # PR test job remains read-only. Upload results even when a test fails.
      # The existing npm test command and build/deploy jobs are unchanged.
      - name: Upload Benchmark JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-junit
          path: .benchmark/junit.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Benchmark Node coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-lcov
          path: .benchmark/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  images:
    name: Docker build and publish
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Use the runner's built-in Docker BuildKit; the container driver pulls
      # moby/buildkit from Docker Hub and is vulnerable to rate limits/timeouts.
      - name: Log in to GHCR for main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build server image (publish on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/server.Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/affank1020/atlas-server:${{ github.sha }}
            ghcr.io/affank1020/atlas-server:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # The built-in Docker driver does not support the GitHub Actions cache exporter.
          cache-from: type=registry,ref=ghcr.io/affank1020/atlas-server:latest
          cache-to: type=inline
          provenance: false
      - name: Build web image (publish on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/web.Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/affank1020/atlas-web:${{ github.sha }}
            ghcr.io/affank1020/atlas-web:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=registry,ref=ghcr.io/affank1020/atlas-web:latest
          cache-to: type=inline
          provenance: false
