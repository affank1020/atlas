name: Atlas macOS Node staging

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/macos-node-stage.py"
      - "test/test_macos_node_stage.py"
      - ".github/workflows/macos-node-stage.yml"
  push:
    branches: [main]
    paths:
      - "scripts/macos-node-stage.py"
      - "test/test_macos_node_stage.py"
      - ".github/workflows/macos-node-stage.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Verify macOS signed release staging
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate macOS staging and unsigned-archive rejection
        run: |
          python3 -m unittest discover -s test -p 'test_macos_node_stage.py' -v
          python3 -m py_compile scripts/macos-node-stage.py
