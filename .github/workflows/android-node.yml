name: Android Node

on:
  pull_request:
    paths:
      - "apps/android-node/**"
      - ".github/workflows/android-node.yml"
  push:
    branches: [main]
    paths:
      - "apps/android-node/**"
      - ".github/workflows/android-node.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: JVM regression tests and APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-android-node-junit
          path: apps/android-node/app/build/test-results/testDebugUnitTest/*.xml
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-android-node-debug
          path: apps/android-node/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

  emulator-ui:
    name: Android emulator UI regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/android-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd apps/android-node && gradle :app:connectedDebugAndroidTest --no-daemon
      - name: Upload emulator test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-android-emulator-test-results
          path: apps/android-node/app/build/outputs/androidTest-results/connected/
          retention-days: 14
          if-no-files-found: warn
