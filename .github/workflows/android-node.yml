name: Android Node

on:
  pull_request:
    paths:
      - "apps/android-node/**"
      - ".github/workflows/android-node.yml"
  push:
    branches: [main]
    paths:
      - "apps/android-node/**"
      - ".github/workflows/android-node.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: JVM regression tests and APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-android-node-junit
          path: apps/android-node/app/build/test-results/testDebugUnitTest/*.xml
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-android-node-debug
          path: apps/android-node/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
